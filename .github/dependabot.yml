# REQ-207 (FAIL-951): dependency and action updates arrive as pull requests,
# weekly, instead of when someone remembers. Security updates for known
# advisories are separate and always on once Dependabot is enabled for the
# repository (Settings, Advanced Security).
#
# Grouped so a week is a handful of PRs. The Expo SDK moves as a set, so its
# packages are grouped and major bumps of them are ignored here: take those
# deliberately (docs/next-store-build-plan.md), not from a bot.
#
# REQ-229: several major bumps the bot proposed failed CI. They are taken on
# purpose, with the Expo SDK step or a planned upgrade, so the bot no longer
# proposes them: @expo/*, babel-preset-expo, @babel/core and TypeScript in
# /mobile; TypeScript, React, React DOM, their types and @types/bcryptjs in
# /backend. The sandbox image stays on the Python line its verification
# programs were tested on, so minor (and major) Python bumps are ignored too;
# digest and patch updates still arrive.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/bcryptjs"
        update-types: [version-update:semver-major]
      # Nov 12, 2026 (Nick, PR cleanup): taken in a planned upgrade, not from the
      # bot. The SDK's 1.x can change real API behaviour that mocked tests miss.
      - dependency-name: "@anthropic-ai/sdk"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: "@vercel/oidc"
        update-types: [version-update:semver-major]
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: expo
        update-types: [version-update:semver-major]
      - dependency-name: expo-*
        update-types: [version-update:semver-major]
      - dependency-name: react-native
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: "@expo/*"
        update-types: [version-update:semver-major]
      - dependency-name: babel-preset-expo
        update-types: [version-update:semver-major]
      - dependency-name: "@babel/core"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Nov 12, 2026: React 19.3 changes ref and ScrollView types and breaks the
      # mobile typecheck (#141). React minors move with the Expo SDK step
      # (docs/next-store-build-plan.md), so the bot proposes only patches.
      - dependency-name: react
        update-types: [version-update:semver-minor]
      - dependency-name: react-dom
        update-types: [version-update:semver-minor]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-minor]
    groups:
      expo-sdk:
        patterns: [expo, expo-*, "@expo/*"]
        update-types: [minor, patch]
      mobile-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /backend/sandbox
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
