name: CI

on:
  push:
    branches: [master]
  # Every pull request, not only ones into master, so stacked PRs (a PR
  # based on another PR's branch) are checked too.
  pull_request:

jobs:
  backend:
    name: Backend (typecheck, build, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      # REQ-080: node:test suites for the mastery engine, prompt framing and
      # grading helpers -- pure modules, no database or API key needed.
      - run: npm test
        working-directory: backend
      # Real secrets are never needed at build time (every server module reads
      # process.env lazily, inside request handlers -- see lib/db.ts,
      # lib/email.ts), but Next.js still needs the names present so nothing
      # throws while it traces/bundles routes.
      - run: npm run build
        working-directory: backend
        env:
          DATABASE_URL: postgres://user:pass@localhost:5432/ci_placeholder
          AUTH_JWT_SECRET: ci-placeholder-jwt-secret
          AUTH_ENCRYPTION_KEY: 0000000000000000000000000000000000000000000=
          APP_BASE_URL: http://localhost:3000
          GOOGLE_OAUTH_CLIENT_IDS: ci-placeholder.apps.googleusercontent.com
          RESEND_API_KEY: re_ci_placeholder
          ANTHROPIC_API_KEY: sk-ant-ci-placeholder
      # Blocking: this package is currently clean, so a newly introduced
      # high/critical advisory should fail CI rather than go unnoticed.
      - run: npm audit --audit-level=high
        working-directory: backend

  # REQ-128: nothing in CI touched a database before, so a migration that
  # didn't apply, SQL that named a missing column, or code that needed a
  # migration production hadn't run could all ship green. This builds the
  # schema from zero exactly as `npm run migrate -- --all` would in
  # production, checks every object the code needs is there (the same
  # probes /api/health runs), seeds the catalog twice to prove the seed is
  # repeatable, and runs the integration tests against it.
  database:
    name: Database (migrations, seed, integration tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ascendra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ascendra
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Supabase's API roles (026 and 052 revoke from them)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci/supabase-roles.sql
        working-directory: backend
      - name: Apply every migration to an empty database
        run: npm run migrate -- --all
        working-directory: backend
      - name: Schema has everything the code needs
        run: npm run migrate -- --status
        working-directory: backend
      - name: Seed the catalog (twice, to prove it is repeatable)
        run: npm run seed && npm run seed
        working-directory: backend
      - name: Integration tests
        run: npm run test:db
        working-directory: backend

  # REQ-118 (Audit 3 LOW-11): the job above builds the schema on an EMPTY
  # database, so the data migrations (029b, 031b, 037b, 041b: backups,
  # backfills, recomputes) never ran over a single row in CI. This applies
  # 001-028, loads a synthetic history written against the 028 schema
  # (scripts/ci/synthetic-history.sql: 1,500 learners, ~122k attempts, about
  # 10 s), applies everything after it, runs the batched recompute, and
  # fails unless the backfills did real work and every stored level equals
  # the rule (scripts/ci/backfill-check.sql). About 2-3 minutes; raise
  # -v learners for a heavier run locally.
  backfill:
    name: Database (backfills over a synthetic history)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ascendra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ascendra
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Supabase's API roles (026 and 052 revoke from them)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci/supabase-roles.sql
        working-directory: backend
      - name: Apply 001-028 (the schema the backfills start from)
        working-directory: backend
        run: |
          for f in $(ls supabase/migrations | LC_ALL=C sort); do
            [[ "$f" > "029" ]] && break
            npm run -s migrate -- "$f"
          done
      - name: Load a synthetic learner history
        run: psql "$DATABASE_URL" -v learners=1500 -v per_learner=80 -f scripts/ci/synthetic-history.sql
        working-directory: backend
      - name: Apply the rest, including every backfill
        run: npm run migrate -- --all && npm run migrate -- --status
        working-directory: backend
      - name: Batched recompute (as the runbook does after deploy)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "call recompute_mastery_batched();"
        working-directory: backend
      - name: Backfills did real work and levels match the rule
        run: psql "$DATABASE_URL" -f scripts/ci/backfill-check.sql
        working-directory: backend

  # Release 2026-11-07: production is master @ c3e13ab's schema plus line B's
  # 025-027. This rebuilds that state (master's own migrations, seed and
  # routes making 3 accounts and 25 answers), then: the release's --status
  # lists exactly its new files, --all, schema current with no mastery
  # drift, the batched recompute, the release seed; master's routes still
  # work on the migrated schema; the rollback script restores the
  # production-state schema (enum values aside) and master's routes work
  # again; and a fresh database ends identical. About 3 minutes.
  rehearsal:
    name: Database (production-state rehearsal and rollback)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needs master @ c3e13ab and line B's branch
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: bash scripts/rehearse-production-migration.sh
        working-directory: backend

  mobile:
    name: Mobile (typecheck, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      # REQ-084: node:test over the pure helpers in mobile/src/lib (Node 24
      # strips types natively, so no extra tooling).
      - run: npm test
        working-directory: mobile
      # Report-only, not blocking: Expo's own CLI toolchain currently ships
      # transitive advisories (uuid/bunyan/xcode, build-time only, not in the
      # shipped app bundle) with no non-breaking fix available. Gating on
      # this would make the check permanently red instead of meaningful --
      # revisit turning this blocking once `npm audit fix` (or an Expo SDK
      # bump) actually clears it.
      #
      # REQ-118: still report-only (re-checked 2026-11-07, Audit 3 LOW-11): the
      # advisories are in Expo's CLI/build tooling, not the app bundle. Read
      # this step's log when bumping the Expo SDK; make it blocking once it is
      # clean.
      - run: npm audit --audit-level=high || true
        working-directory: mobile
      # REQ-118: Expo's project health checks (config, native module
      # versions, duplicate dependencies). Report-only for now: on 2026-11-07
      # 20 of 21 checks passed and the one failure was ten expo-* packages a
      # patch release behind SDK 57's expected versions (`npx expo install
      # --check` fixes it). Make this blocking after that bump. The JS bundle
      # itself is exported in the backend job's build (scripts/build-webapp.sh
      # runs `expo export --platform web`), so a broken import fails CI there.
      - run: npx -y expo-doctor@1.21.6 || true
        working-directory: mobile

  omni-workspace:
    name: OmniEngineering workspace freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Blocking: regenerates the same files `./omni sync` / `./omni map`
      # produce locally and fails if that's not what's committed -- catches
      # the exact drift this workspace had (project-map.md describing the
      # wrong repo) automatically, since nothing else runs these on a
      # schedule or on commit.
      - run: python omni sync
      - run: python omni map
      - run: git diff --exit-code -- .ai .cursorignore .cursorrules AGENTS.md CLAUDE.md LLM_CONTEXT.md .github/copilot-instructions.md .kiro/steering/omnicontext.md
      # Report-only: omni doctor also fails on checks that assume this repo
      # IS OmniEngineering's own project (a LICENSE/NOTICE/TRADEMARKS.md for
      # OmniEngineering itself, backend/ and mobile/ flagged as "unexpected
      # paths"). Those don't apply to an adopted repo like this one and
      # there's no flag to scope them off, so this step is visibility only --
      # read its output in the job log rather than relying on its exit code.
      - run: python omni doctor || true
