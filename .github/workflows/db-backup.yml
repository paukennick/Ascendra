# REQ-200: nightly encrypted logical backup of the PRODUCTION database.
#
# Supabase's Free plan keeps no downloadable backups, so this takes one:
# pg_dump --format=custom of the whole database (--no-owner --no-privileges;
# roles are never in a pg_dump) streamed straight into `age`, encrypted to
# the public key in BACKUP_AGE_RECIPIENT (a repository variable, or a secret
# of that name). The plaintext dump never touches the runner's disk. Only the
# public key lives in GitHub; the private key is in Nick's password manager.
#
# This repository is PUBLIC, so anyone signed in to GitHub can download the
# artifact: it is useless without the private key. The manifest (size, server
# version, table count, row counts of app_users/attempts/mastery; no user
# data) is encrypted to the same key as manifest.json.age. The only plaintext
# in the artifact is checksums.json: a format number and the sha256 of the two
# encrypted files. Nothing about the database is printed to the log. Kept 30
# days (the privacy policy says 30 days; change both together).
#
# Connects exactly like migrate-production.yml: the PROD_DATABASE_URL secret
# (Supabase Session pooler URI) in the production-database environment.
# The script never prints it. Daily at 11:23 UTC (03:23 PST / 04:23 PDT), and
# by hand from the Actions tab. Setup, restore and limits:
# docs/operations-runbook.md "Backups"; drill: docs/restore-drill.md.
name: Nightly database backup
on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:
concurrency:
  group: db-backup
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production-database
    timeout-minutes: 30
    defaults:
      run:
        shell: bash # -eo pipefail: a failed pg_dump fails the step
    steps:
      - name: Refuse to run without the connection secret and the age recipient
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT || secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          set +x
          test -n "$DATABASE_URL" || { echo "::error::PROD_DATABASE_URL secret is not set"; exit 1; }
          test -n "$BACKUP_AGE_RECIPIENT" || { echo "::error::BACKUP_AGE_RECIPIENT (repository variable or secret) is not set"; exit 1; }
      - uses: actions/checkout@v4
        with:
          sparse-checkout: backend/scripts
      # pg_dump must be at least the server's major version (production runs
      # Postgres 17); the runner's preinstalled client may be older.
      - name: Install age and the PostgreSQL 17 client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q age jq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          age --version
      - name: Dump and encrypt the database and its manifest
        id: backup
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT || secrets.BACKUP_AGE_RECIPIENT }}
          PG_BIN: /usr/lib/postgresql/17/bin
          OUT_DIR: ${{ runner.temp }}/db-backup
          MIN_BACKUP_BYTES: "1048576"
        run: |
          set +x
          bash backend/scripts/db-backup.sh | tee "$RUNNER_TEMP/db-backup.log"
          name="$(tail -n1 "$RUNNER_TEMP/db-backup.log")"
          test -f "$OUT_DIR/$name"
          echo "name=${name%.dump.age}" >> "$GITHUB_OUTPUT"
          # Only the checksums are plaintext; the manifest stays encrypted.
          cat "$OUT_DIR/checksums.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.name }}
          path: ${{ runner.temp }}/db-backup/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
