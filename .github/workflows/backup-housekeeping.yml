# REQ-168: rolling clean-up of release backup tables in PRODUCTION.
#
# Drops public.backup_release_YYYYMMDD tables whose date is more than 30 days
# before the run date (UTC). Nothing else is touched: not another schema, not
# mastery_backup_* or error_log_backup_*, not a name with anything before or
# after the 8 digits, not a malformed or future date. The filter lives in
# backend/scripts/backup-housekeeping-lib.ts (unit and integration tested).
#
# Monthly on the 8th at 09:17 UTC. The first run after this merged is
# 2026-12-08, the first day backup_release_20261107 is more than 30 days old
# (2026-11-07 + 30 days = 2026-12-07, which is still kept). Because it runs
# monthly, a backup is kept at least 30 days and is dropped by the first run
# after that (at most about two months).
#
# Run by hand from the Actions tab: dry_run defaults to true, which logs what
# would be dropped (name, date, age, row count) and drops nothing. Untick it to
# drop. Connects exactly like migrate-production.yml: the PROD_DATABASE_URL
# secret (Supabase Session pooler) in the production-database environment.
# The script only logs table names, dates and counts, never the URL.
name: Release backup housekeeping
on:
  schedule:
    - cron: "17 9 8 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only log what would be dropped"
        type: boolean
        default: true
concurrency:
  group: backup-housekeeping
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  housekeeping:
    runs-on: ubuntu-latest
    environment: production-database
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      # Scheduled runs drop; manual runs drop only when dry_run is unticked.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: test -n "$DATABASE_URL" || { echo "PROD_DATABASE_URL secret is not set"; exit 1; }
      - run: npm ci
      - name: Drop release backups older than 30 days
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm run backups:housekeeping -- --dry-run
          else
            npm run backups:housekeeping -- --apply
          fi
