# Applies pending database migrations to PRODUCTION. Runs only when someone
# pushes to ops/migrate-production (before a deploy) or
# ops/post-deploy-production (after it: also seeds the catalog and
# recomputes mastery) -- never on PRs or master -- and only with the
# PROD_DATABASE_URL repository secret (Supabase Session pooler URI; the
# direct host is IPv6-only and unreachable from GitHub's runners). It shows
# --status before and after, applies with --all, and prints the mastery
# drift check. See docs/deploy-runbook-integration.md, "Routine deploys".
name: Migrate production database
on:
  push:
    branches: [ops/migrate-production, ops/post-deploy-production]
concurrency:
  group: migrate-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    # REQ-207 (FAIL-944): a hung migration held the production connection and
    # the concurrency group until GitHub's 6-hour default.
    timeout-minutes: 30
    environment: production-database
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: test -n "$DATABASE_URL" || { echo "PROD_DATABASE_URL secret is not set"; exit 1; }
      - run: npm ci
      # REQ-207 (FAIL-944): `|| true` hid a wrong password or an unreachable
      # database here and let the next step fail with a less useful message.
      # Exit 2 means "schema is missing objects" (the normal state before
      # applying); anything else is a real failure and stops the job.
      - name: Status before
        run: |
          set +e
          npm run migrate -- --status
          rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::migrate --status failed (exit $rc): not a missing-migration report"
            exit "$rc"
          fi
      - name: Apply pending migrations
        run: npm run migrate -- --all
      - name: Status after
        run: npm run migrate -- --status
      # Post-deploy (docs/deploy-runbook-integration.md steps 5-6). Only on
      # pushes to ops/post-deploy-production, after the backend is live.
      - name: Seed the catalog
        if: github.ref == 'refs/heads/ops/post-deploy-production'
        run: npm run seed
      - name: Recompute mastery
        if: github.ref == 'refs/heads/ops/post-deploy-production'
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "call recompute_mastery_batched();"
      - name: Status after post-deploy
        if: github.ref == 'refs/heads/ops/post-deploy-production'
        run: npm run migrate -- --status
