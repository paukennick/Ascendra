name: Keep Supabase awake

# REQ-083: Supabase pauses a free project after 7 days without activity.
# /api/health runs `select 1` against the database, so hitting it is enough
# to count as activity. The Vercel cron in backend/vercel.json does the same
# thing from the other side; this is the independent second trigger so a
# problem with either one doesn't silently let the project pause.
on:
  schedule:
    # 09:30 UTC daily, offset from the Vercel cron at 09:00.
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit production health endpoint
        run: |
          # REQ-207 (FAIL-949): the body is not printed. It is public and
          # the run log is world-readable on a public repo; the status code is
          # the signal, and details need the cron token (see /api/health).
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 \
            https://backend-mauve-mu-18.vercel.app/api/health)
          echo "health status: $code"
          test "$code" = "200"
